<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🛠️ CR 工具箱 · 后台管理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a24; color: #e6e6e6; font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; padding: 20px; min-height: 100vh; }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; color: #50fa7b; margin-bottom: 6px; }
  .sub { color: #6272a4; font-size: 13px; margin-bottom: 20px; }
  .card { background: #1e1e2e; border: 1px solid #44475a; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 15px; color: #8be9fd; margin-bottom: 12px; }
  .stat-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 130px; background: #282a36; border: 1px solid #44475a; border-radius: 10px; padding: 14px; text-align: center; }
  .stat b { display: block; font-size: 26px; color: #50fa7b; }
  .stat span { font-size: 12px; color: #6272a4; }
  .btn { background: #44475a; color: #e6e6e6; border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 13px; margin-right: 8px; }
  .btn:hover { background: #6272a4; }
  .btn.red { background: #ff5555; }
  .btn.green { background: #50fa7b; color: #1e1e2e; font-weight: bold; }
  .btn.small { padding: 4px 10px; font-size: 12px; }
  .item { background: #282a36; border: 1px solid #44475a; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .item .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .item .nm { font-weight: bold; color: #50fa7b; font-size: 14px; }
  .item .tm { font-size: 11px; color: #6272a4; }
  .item .ct { margin-top: 8px; font-size: 14px; line-height: 1.6; word-break: break-word; white-space: pre-wrap; }
  .badge { display: inline-block; background: #ffd700; color: #1e1e2e; font-size: 11px; font-weight: bold; border-radius: 4px; padding: 1px 7px; }
  .badge.gray { background: #6272a4; color: #e6e6e6; }
  .ops { margin-top: 8px; }
  .empty { color: #6272a4; text-align: center; padding: 40px; font-size: 14px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .back { color: #8be9fd; text-decoration: none; font-size: 13px; cursor: pointer; }
  .back:hover { text-decoration: underline; }
  #authBox { text-align: center; padding: 30px 20px; }
  #authBox input { width: 260px; max-width: 90%; padding: 10px 12px; border-radius: 8px; border: 1px solid #44475a; background: #282a36; color: #e6e6e6; font-size: 14px; margin: 10px 0; }
  .msg { color: #ff5555; font-size: 13px; margin-top: 8px; min-height: 18px; }
  .ok-msg { color: #50fa7b; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <h1>🛠️ CR 工具箱 · 后台管理</h1>
    <a class="back" href="index.html">← 返回主页</a>
  </div>
  <div class="sub">数据存储在云端（GitHub 仓库），与本地电脑自动同步。需要 Server 管理员身份进入。</div>

  <!-- 鉴权 -->
  <div class="card" id="authBox">
    <h2>🔐 管理员验证</h2>
    <div>请输入 Server 管理员密码：</div>
    <input type="password" id="adminPass" placeholder="Server 密码" autocomplete="off">
    <div><button class="btn green" id="btnLogin">进入后台</button></div>
    <div class="msg" id="authMsg"></div>
    <div class="sub" style="margin-top:8px">提示：密码与本地后端 Server 账号一致。</div>
  </div>

  <!-- 管理面板 -->
  <div id="panel" style="display:none">
    <div class="card">
      <h2>📊 数据概览</h2>
      <div class="stat-row">
        <div class="stat"><b id="stWall">0</b><span>留言总数</span></div>
        <div class="stat"><b id="stPin">0</b><span>置顶公告</span></div>
        <div class="stat"><b id="stAdmin">0</b><span>管理员留言</span></div>
        <div class="stat"><b id="stCloud">--</b><span>云端状态</span></div>
      </div>
    </div>

    <div class="card">
      <h2>💬 留言管理</h2>
      <div style="margin-bottom:10px">
        <button class="btn" id="btnRefresh">🔄 刷新</button>
        <button class="btn red" id="btnClear">🗑️ 清空全部留言</button>
        <span class="sub" style="margin-left:8px">（云端 + 本地同步删除）</span>
      </div>
      <div id="wallList"></div>
    </div>
  </div>
</div>

<script src="https://CaesarPC.github.io/website-finder/clip.js?v=20261005v4"></script>
<script>
var CLOUD_REPO = 'CaesarPC/website-finder';
var CLOUD_WALL = 'api_data/wall.json';
var isAuthed = false;
var wallList = [];

function b64encode(str) {
  if (typeof btoa === 'function') return btoa(unescape(encodeURIComponent(str)));
  var bytes = new TextEncoder().encode(str);
  var bin = '';
  bytes.forEach(function (b) { bin += String.fromCharCode(b); });
  return btoa(bin);
}
function sha256hex(str) {
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function (buf) {
    return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  });
}

/* 带超时的fetch */
function fetchT(url, ms) {
  var c = new AbortController();
  var t = setTimeout(function () { c.abort(); }, ms || 12000);
  return fetch(url, { cache: 'no-store', signal: c.signal }).then(function (r) { clearTimeout(t); return r; });
}

/* 云端文件多源读取：jsDelivr CDN(国内快) -> raw 兜底 */
var CLOUD_SOURCES = [
  'https://cdn.jsdelivr.net/gh/' + CLOUD_REPO + '@main/' + CLOUD_WALL,
  'https://raw.githubusercontent.com/' + CLOUD_REPO + '/main/' + CLOUD_WALL
];

/* 读取云端 */
function cloudGet(cb) {
  var tryN = 0;
  function next() {
    if (tryN >= CLOUD_SOURCES.length) { cb(null); return; }
    var u = CLOUD_SOURCES[tryN++];
    fetchT(u).then(function (r) {
      if (!r.ok) throw 0;
      return r.json();
    }).then(function (j) {
      cb(j && Array.isArray(j.list) ? j.list : []);
    }).catch(function () { next(); });
  }
  next();
}
/* 写入云端：通过本地后端代理同步 */
function cloudSave(list, cb) {
  var apiUrl = localStorage.getItem('cr_api_url') || '';
  if (!apiUrl) { cb(false, '电脑后端未连接'); return; }
  fetch(apiUrl + '/api/wall/sync', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ list: list, token: localStorage.getItem('cr_token') })
  }).then(function (r) { return r.json(); }).then(function (j) {
    cb(j.ok, j.msg || '');
  }).catch(function () { cb(false, '后端连接失败'); });
}

function renderStats() {
  document.getElementById('stWall').textContent = wallList.length;
  document.getElementById('stPin').textContent = wallList.filter(function (x) { return x.pinned; }).length;
  document.getElementById('stAdmin').textContent = wallList.filter(function (x) { return x.admin; }).length;
  document.getElementById('stCloud').textContent = '已加载';
}
function renderList() {
  var el = document.getElementById('wallList');
  if (!wallList.length) { el.innerHTML = '<div class="empty">暂无留言</div>'; renderStats(); return; }
  var h = '';
  wallList.slice().reverse().forEach(function (x) {
    h += '<div class="item">' +
      '<div class="head"><span class="nm">' + esc(x.name) + '</span>' +
      (x.admin ? ' <span class="badge">👑 管理员</span>' : '') +
      (x.pinned ? ' <span class="badge gray">📌 置顶</span>' : '') +
      '<span class="tm">' + esc(x.time) + '</span></div>' +
      '<div class="ct">' + esc(x.content) + '</div>' +
      '<div class="ops">' +
      '<button class="btn small" onclick="togglePin(' + x.id + ', ' + !x.pinned + ')">' + (x.pinned ? '取消置顶' : '置顶') + '</button>' +
      '<button class="btn red small" onclick="delOne(' + x.id + ')">删除</button>' +
      '</div></div>';
  });
  el.innerHTML = h;
  renderStats();
}
function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function loadData() {
  cloudGet(function (list) {
    if (!list) { document.getElementById('stCloud').textContent = '云端离线'; return; }
    wallList = list;
    renderList();
  });
}

function togglePin(id, pinned) {
  var it = wallList.filter(function (x) { return x.id === id; })[0];
  if (!it) return;
  it.pinned = pinned;
  cloudSave(wallList, function (ok, msg) {
    if (ok) { renderList(); alert(pinned ? '已置顶 📌' : '已取消置顶'); }
    else alert(msg || '同步失败（电脑未开机？）');
  });
}
function delOne(id) {
  if (!confirm('确定删除这条留言？')) return;
  wallList = wallList.filter(function (x) { return x.id !== id; });
  cloudSave(wallList, function (ok, msg) {
    if (ok) { renderList(); alert('已删除'); }
    else alert(msg || '同步失败（电脑未开机？）');
  });
}

/* 鉴权：SHA256 哈希比对云端 auth.json（不依赖本地后端，电脑关机也能进后台） */
document.getElementById('btnLogin').onclick = function () {
  var pass = document.getElementById('adminPass').value;
  var msgEl = document.getElementById('authMsg');
  if (!pass) { msgEl.textContent = '请输入密码'; return; }
  msgEl.textContent = '验证中...';
  var authSources = [
    'https://cdn.jsdelivr.net/gh/' + CLOUD_REPO + '@main/api_data/auth.json',
    'https://raw.githubusercontent.com/' + CLOUD_REPO + '/main/api_data/auth.json'
  ];
  var idx = 0;
  function tryAuth() {
    if (idx >= authSources.length) { msgEl.textContent = '无法连接云端认证（网络慢？请重试）'; return; }
    var u = authSources[idx++];
    fetchT(u).then(function (r) {
      if (!r.ok) throw 0;
      return r.json();
    }).then(function (auth) {
      return sha256hex(pass).then(function (h) {
        if (h === auth.server_hash) {
          localStorage.setItem('cr_user', 'Server');
          document.getElementById('authBox').style.display = 'none';
          document.getElementById('panel').style.display = 'block';
          loadData();
        } else {
          msgEl.textContent = '密码错误，请重试';
        }
      });
    }).catch(function () { tryAuth(); });
  }
  tryAuth();
};
</script>
</body>
</html>
