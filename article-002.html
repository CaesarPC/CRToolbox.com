<h1>URL编码是什么</h1>
<div class="meta">2026-10-06 · 教程</div>
<div class="content">
<p>你有没有见过网址里出现%20、%E4%B8%AD这种字符？这就是URL编码。</p>
<p>因为网址里只能用英文和数字，遇到空格、中文这些特殊字符，就得用%加两位数字表示。</p>
<p>比如空格就是%20，中文你就是%E4%BD%A0。</p>
