<h1>CSS响应式图片</h1>
<div class="meta">Cr工具站 · 技术教程</div>
<p>CSS响应式图片</p>
<p>响应式图片让浏览器根据屏幕尺寸选择合适大小的图片。srcset属性提供多个尺寸，浏览器自动选择。sizes属性告知图片在不同布局下的显示尺寸。</p>
<p>示例：<img src small.jpg srcset="small.jpg 400w, medium.jpg 800w, large.jpg 1200w" sizes="(max-width: 600px) 400px, 800px">。浏览器根据屏幕和布局选择合适的图片。</p>
<p>CSS里max-width: 100%防止图片溢出容器。object-fit控制图片裁剪方式（cover填充、contain完整显示）。</p>
<p>响应式图片节省流量：手机加载小图，桌面加载大图。这是性能优化的重要手段。</p>
