<p>CSS变量与主题切换实战</p>
<p>CSS自定义属性让样式动态化。--color: blue;使用var(--color)。JS通过setProperty动态修改。</p>
<p>主题切换：两套变量值（亮色/暗色），data-theme切换。:root默认亮色，[data-theme="dark"]暗色。切换属性，所有引用处自动更新。</p>
<p>CSS变量是响应式的，修改后所有引用自动更新。</p>
