<h1>JavaScript事件冒泡与捕获</h1>
<div class="meta">Cr工具站 · 技术教程</div>
<p>JavaScript事件冒泡与捕获</p>
<p>事件传播三阶段：捕获（从window到目标）、目标、冒泡（从目标到window）。addEventListener第三参数true=捕获，false=冒泡。</p>
<p>事件委托利用冒泡：父元素监听，通过target判断子元素。减少监听器，动态元素自动绑定。</p>
<p>stopPropagation阻止传播，preventDefault阻止默认行为。</p>
