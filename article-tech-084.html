<h1>JavaScript深浅拷贝</h1>
<div class="meta">Cr工具站 · 技术教程</div>
<p>JavaScript深拷贝与浅拷贝</p>
<p>浅拷贝只复制第一层：Object.assign、{...obj}。嵌套对象还是共享引用。
深拷贝递归复制所有层级：structuredClone()（现代浏览器原生）、lodash.cloneDeep。JSON.parse(JSON.stringify(obj))简单但有缺陷（函数/undefined丢失、循环引用报错）。</p>
<p>理解深浅拷贝区别，避免意外修改原数据。</p>
