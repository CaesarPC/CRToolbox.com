<p>JavaScript可选链与空值合并</p>
<p>可选链?.安全访问嵌套属性：user?.address?.city，不存在时返回undefined不报错。
空值合并??只在左侧是null/undefined时返回右侧。和||的区别：||把0、空字符串当falsy，??只认null/undefined。</p>
<p>这两个运算符让代码更安全简洁。</p>
