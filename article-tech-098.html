<h1>CSS容器查询组件化</h1>
<div class="meta">Cr工具站 · 技术教程</div>
<p>CSS容器查询组件化</p>
<p>容器查询根据组件所在容器宽度调整样式，不是根据屏幕宽度。组件放在宽容器里横排，窄容器里竖排。组件真正可复用。</p>
<p>父元素container-type: inline-size；@container规则根据容器宽度写样式。这是响应式设计从页面级到组件级的演进。</p>
