<h1>JavaScript闭包与柯里化</h1>
<div class="meta">Cr工具站 · 技术教程</div>
<p>JavaScript闭包与函数柯里化</p>
<p>柯里化（Currying）把多参数函数变成单参数函数链。function add(a) { return function(b) { return a+b } }。add(1)(2)=3。</p>
<p>柯里化利用闭包保存参数，逐步传入。这是函数式编程的技巧，让函数更灵活复用。</p>
