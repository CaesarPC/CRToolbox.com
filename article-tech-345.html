<h1>CSS_Flexbox对齐属性</h1>
<div class="meta">Cr工具站 · 技术教程</div>
<p>CSS Flexbox对齐属性</p>
<p>justify-content主轴对齐：flex-start、flex-end、center、space-between、space-around、space-evenly。</p>
<p>align-items交叉轴对齐：stretch、flex-start、flex-end、center、baseline。</p>
<p>align-content多行对齐：值同justify-content。</p>
<p>掌握这些属性，一维布局的对齐问题都能解决。</p>
