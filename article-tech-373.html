<p>JavaScript原型链继承</p>
<p>每个对象有__proto__指向原型。访问属性时沿链查找。构造函数的prototype是原型对象，new创建的实例共享原型方法。</p>
<p>ES6 class是语法糖，底层还是原型链。理解原型链，才能搞懂JS对象系统。</p>
