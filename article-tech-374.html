<h1>CSS响应式字体大小</h1>
<div class="meta">Cr工具站 · 技术教程</div>
<p>CSS响应式字体大小</p>
<p>用clamp()函数实现流畅缩放：font-size: clamp(16px, 2vw, 24px)。最小16px，最大24px，中间随视口宽度变化。不用写一堆媒体查询，一行代码搞定响应式字体。</p>
<p>clamp(min, preferred, max)是现代CSS的响应式利器，字体、间距、尺寸都能用。</p>
