<h1>CSS颜色与单位</h1>
<div class="meta">Cr工具站 · 技术教程</div>
<p>CSS颜色与单位</p>
<p>颜色表示：关键字（red）、十六进制（#ff0000）、RGB（rgb(255,0,0)）、RGBA（带透明度）、HSL（色相饱和度亮度）。现代推荐HSL，调色调色更直观。</p>
<p>单位：px（绝对）、rem（相对根字体）、em（相对父元素）、%（相对父元素）、vw/vh（视口）。字体用rem，布局用%或vw。</p>
