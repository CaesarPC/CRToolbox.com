<h1>CSS边框与圆角</h1>
<div class="meta">Cr工具站 · 技术教程</div>
<p>CSS边框与圆角</p>
<p>border设置边框宽度、样式、颜色。border-radius做圆角。border可以分别设四边。outline是外边框，不占空间，常用于聚焦状态。</p>
<p>box-shadow做阴影：水平偏移、垂直偏移、模糊半径、扩展半径、颜色。多层阴影用逗号分隔。</p>
<p>border-radius配合overflow:hidden做卡片圆角图片。</p>
