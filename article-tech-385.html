<p>CSS背景与渐变</p>
<p>background-color设背景色。background-image设背景图。background-repeat控制重复。background-position控制位置。background-size控制尺寸（cover铺满、contain完整）。</p>
<p>线性渐变linear-gradient(to right, red, blue)。径向渐变radial-gradient。渐变做背景是现代设计常用手段。</p>
