<p>JavaScript JSON处理</p>
<p>JSON.stringify把对象转JSON字符串。JSON.parse把JSON字符串转对象。前后端数据交换都用JSON。</p>
<p>常见坑：JSON不支持undefined和函数，会被忽略。循环引用会报错。日期会转成字符串。深拷贝可以用JSON.parse(JSON.stringify())，但有上述限制。</p>
