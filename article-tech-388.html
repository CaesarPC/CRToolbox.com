<h1>JavaScript定时器</h1>
<div class="meta">Cr工具站 · 技术教程</div>
<p>JavaScript定时器</p>
<p>setTimeout延迟执行一次。setInterval每隔固定时间执行。clearTimeout/clearInterval取消。</p>
<p>常见坑：setInterval不关心上次任务是否完成，可能堆叠。用setTimeout递归代替setInterval更可控。组件卸载时记得清除定时器，否则内存泄漏。</p>
