<div class="meta">Cr工具站 · 技术教程</div>
<p>JavaScript BOM与浏览器API</p>
<p>BOM（浏览器对象模型）：window.location（URL）、window.history（前进后退）、window.navigator（浏览器信息）、window.screen（屏幕信息）。location.href跳转页面。history.pushState修改URL。</p>
<p>这些API让网页能和浏览器交互，做路由跳转、页面导航。</p>
