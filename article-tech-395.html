<p>CSS浮动布局详解</p>
<p>float让元素向左或向右浮动，文字环绕。现代布局用Flexbox/Grid，float主要用于文字环绕图片。</p>
<p>清除浮动：overflow:hidden（触发BFC包含浮动子元素）、clearfix伪元素。浮动会导致父元素高度塌陷，需要清除。</p>
