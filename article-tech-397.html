<h1>CSS阴影与特效</h1>

<p>CSS阴影与特效</p>
<p>box-shadow做盒子阴影：水平偏移、垂直偏移、模糊、扩展、颜色。多层阴影逗号分隔。text-shadow做文字阴影。</p>
<p>filter做视觉效果：blur模糊、brightness亮度、contrast对比度、grayscale灰度。backdrop-filter做毛玻璃效果。</p>
