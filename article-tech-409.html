<h1>JavaScript闭包与作用域</h1>
<div class="meta">Cr工具站 · 技术教程</div>
<p>JavaScript闭包与作用域</p>
<p>闭包让内部函数访问外部变量。作用域链：当前→外层→全局。var函数作用域，let/const块级作用域。</p>
<p>闭包用途：数据私有化、函数工厂、防抖节流。理解作用域链才能搞懂变量查找。</p>
