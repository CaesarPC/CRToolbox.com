<p>CSS盒模型详解</p>
<p>每个元素是矩形盒子：content+padding+border+margin。box-sizing:border-box让width包含padding+border。现代项目普遍设* {box-sizing:border-box}。</p>
<p>margin会重叠，padding不会。理解盒模型才能正确计算尺寸。</p>
