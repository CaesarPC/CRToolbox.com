<h1>Base64编码是什么</h1>
<div class="meta">Cr工具站 · 技术教程</div>
<p>你有没有见过这样一串奇怪的字符：SGVsbG8gV29ybGQh？这就是Base64编码。</p>
<p>它不是加密，而是一种翻译——把图片、文件这些二进制数据，翻译成纯字母数字，方便在网页里传输。</p>
<p>你在网页上看到的小图标、头像，很多就是用Base64嵌进去的，不用额外加载图片文件。</p>
