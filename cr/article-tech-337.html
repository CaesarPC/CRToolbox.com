<h1>JavaScript模块化系统</h1>
<div class="meta">Cr工具站 · 技术教程</div>
<p>JavaScript模块化系统</p>
<p>ES Module是现代标准：export导出，import导入。浏览器原生支持（script type="module"）。静态导入，支持tree-shaking。</p>
<p>CommonJS（require）是Node.js传统方案，动态加载。ES Module静态编译，支持优化。</p>
<p>现代前端项目全部用ES Module。import/export语法，配合打包工具实现模块管理和代码分割。</p>
<p>理解模块化的演进，就明白为什么现在用import而不是require。</p>
