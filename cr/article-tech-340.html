<h1>JavaScript_this指向解析</h1>
<div class="meta">Cr工具站 · 技术教程</div>
<p>JavaScript this指向完全解析</p>
<p>this在调用时确定，不是定义时。规则：默认绑定（全局对象）、隐式绑定（调用对象）、显式绑定（call/apply/bind）、new绑定（新对象）、箭头函数（继承外层this）。</p>
<p>判断顺序：new→call/apply/bind→对象方法→默认。箭头函数例外。</p>
<p>理解this规则，才能搞懂各种场景下this的指向。这是JS面试必考题。</p>
