<h1>CSS定位属性详解</h1>
<div class="meta">Cr工具站 · 技术教程</div>
<p>CSS定位属性详解</p>
<p>五种定位：static（默认）、relative（相对偏移）、absolute（绝对定位，脱离文档流）、fixed（固定视口）、sticky（粘性）。</p>
<p>absolute：相对于最近的定位祖先，脱离文档流。用于弹出层、下拉菜单。
fixed：相对于视口，滚动时不动。用于固定导航栏、回到顶部。
sticky：relative+fixed结合，滚动到阈值时固定。用于表头、分类导航。</p>
<p>理解五种定位，才能正确布局。</p>
