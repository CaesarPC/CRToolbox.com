<h1>JavaScript闭包与作用域</h1>
<div class="meta">Cr工具站 · 技术教程</div>
<p>JavaScript闭包与作用域</p>
<p>闭包让内部函数访问外部函数变量，即使外部函数执行完毕。作用域链：当前作用域→外层作用域→全局作用域。</p>
<p>闭包形成：内部函数引用外部函数变量，外部函数返回后，内部函数依然能访问。垃圾回收不回收还被引用的变量。</p>
<p>用途：数据私有化（外部只能通过方法操作）、函数工厂、防抖节流。理解闭包，才能写出模块化代码。</p>
