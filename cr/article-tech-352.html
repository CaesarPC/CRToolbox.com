<h1>CSS_Grid与Flexbox协同</h1>
<div class="meta">Cr工具站 · 技术教程</div>
<p>CSS Grid与Flexbox协同布局</p>
<p>实际项目中Grid和Flexbox配合使用。Grid做页面宏观框架（header/sidebar/main/footer），Flexbox做组件内部排列（导航栏、卡片内容、按钮组）。</p>
<p>示例：页面整体用Grid分三行两列；主内容区里的卡片列表用Flexbox横排；每个卡片内部用Flexbox对齐图片和文字。</p>
<p>Grid管二维整体，Flex管一维排列。两者互补，不是替代。</p>
