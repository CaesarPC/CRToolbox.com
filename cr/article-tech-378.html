<h1>CSS选择器完全参考</h1>

<p>CSS选择器完全参考</p>
<p>CSS选择器选中元素并应用样式。基础选择器：*（通配）、标签名（div）、类名（.box）、ID（#header）。组合选择器：后代选择器（.box p）、子选择器（.box > p）、相邻兄弟（.box + p）。</p>
<p>属性选择器：[type="text"]选中特定属性。伪类：:hover、:focus、:nth-child(n)。伪元素：::before、::after。</p>
<p>理解选择器优先级（ID>类>标签）和层叠规则，才能写对样式。</p>
