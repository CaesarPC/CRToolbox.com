<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实用工具 | Cr工具站</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#1e1e2e;color:#e6e6e6;min-height:100vh;overflow-x:hidden}
#meteorCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.hd,.grid,.panels{position:relative;z-index:1}
.hd{background:rgba(40,42,54,.9);backdrop-filter:blur(10px);padding:16px 20px;border-bottom:2px solid #50fa7b;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.hd a{color:#50fa7b;text-decoration:none;font-size:14px}
.hd h1{font-size:20px;color:#50fa7b}
.grid{display:flex;flex-wrap:wrap;gap:8px;padding:16px;max-width:900px;margin:0 auto}
.tbtn{background:#282a36;border:1px solid #44475a;border-radius:10px;padding:10px 16px;cursor:pointer;font-size:13px;color:#e6e6e6;transition:all .2s cubic-bezier(.4,0,.2,1)}
.tbtn:hover{border-color:#50fa7b;color:#50fa7b;transform:translateY(-2px)}
.tbtn:active{transform:scale(.95)}
.panels{max-width:900px;margin:0 auto;padding:0 16px 100px}
.panel{background:#282a36;border:1px solid #44475a;border-radius:12px;margin-bottom:12px;overflow:hidden;animation:slideIn .25s cubic-bezier(.4,0,.2,1)}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.p-hd{background:#1e1e2e;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.p-hd .t{font-size:14px;color:#50fa7b;font-weight:bold}
.p-close{background:#44475a;border:none;color:#e6e6e6;width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:14px;line-height:1}
.p-close:hover{background:#ff5555;color:#fff}
.p-body{padding:16px}
input,textarea,select{width:100%;box-sizing:border-box;padding:8px 10px;border-radius:6px;border:1px solid #44475a;background:#1e1e2e;color:#e6e6e6;font-size:14px;margin:4px 0}
button.go{background:#50fa7b;color:#1e1e2e;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;font-weight:bold;margin:4px 0}
.result{background:#1e1e2e;border-radius:6px;padding:10px;margin-top:8px;font-size:13px;color:#bdc3c7;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow-y:auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row input{flex:1;min-width:80px}
.label{font-size:12px;color:#6272a4;margin-top:6px}
</style>
</head>
<body>
<canvas id="meteorCanvas"></canvas>
<div class="hd">
  <a href="https://caesarpc.github.io/caesarbase/main.html" style="opacity:.7;font-size:13px;">← CaesarBase</a>
  <a href="index.html">← 首页</a>
  <h1>🛠️ 实用工具</h1>
</div>
<div class="grid" id="btnGrid"></div>
<div class="panels" id="panels"></div>
<script>
(function(){
  var c=document.getElementById('meteorCanvas'),x=c.getContext('2d'),W,H,ms=[];
  function rz(){W=c.width=innerWidth;H=c.height=innerHeight;}rz();onresize=rz;
  function sp(){var s=2+Math.random()*6;ms.push({x:Math.random()*W*0.8,y:-10,vx:s*0.6,vy:s,life:1,decay:.005+Math.random()*.008,size:1+Math.random()*2,trail:s*8});}
  function lp(){x.fillStyle='rgba(30,30,46,0.15)';x.fillRect(0,0,W,H);
    if(Math.random()<.03)sp();
    for(var i=ms.length-1;i>=0;i--){var m=ms[i];m.x+=m.vx;m.y+=m.vy;m.life-=m.decay;
      if(m.life<=0||m.y>H+50||m.x>W+50){ms.splice(i,1);continue;}
      var g=x.createLinearGradient(m.x,m.y,m.x-m.vx*m.trail,m.y-m.vy*m.trail);
      g.addColorStop(0,'rgba(139,233,253,'+m.life+')');g.addColorStop(1,'rgba(139,233,253,0)');
      x.strokeStyle=g;x.lineWidth=m.size;x.beginPath();x.moveTo(m.x,m.y);x.lineTo(m.x-m.vx*m.trail,m.y-m.vy*m.trail);x.stroke();
    }
    requestAnimationFrame(lp);}lp();
})();
var tools=[
  {id:'qr',icon:'📱',name:'二维码生成器'},
  {id:'pwd',icon:'🔑',name:'密码生成器'},
  {id:'json',icon:'{ }',name:'JSON格式化'},
  {id:'unit',icon:'📏',name:'单位换算'},
  {id:'color',icon:'🎨',name:'颜色选择器'},
  {id:'regex',icon:'🔍',name:'正则测试'},
  {id:'wordcount',icon:'📝',name:'文字统计'},
  {id:'countdown',icon:'⏰',name:'倒计时'},
  {id:'base64',icon:'🔄',name:'Base64编解码'},
  {id:'htmlent',icon:'&lt;&gt;',name:'HTML实体转换'},
  {id:'sort',icon:'↕️',name:'文字排序'},
  {id:'rand',icon:'🎲',name:'随机数/硬币'},
  {id:'markdown',icon:'📄',name:'Markdown预览'},
  {id:'timer',icon:'⏱️',name:'秒表'},
  {id:'calc',icon:'🔢',name:'简易计算器'}
];
var openPanels=[],MAX_PANELS=3;
var grid=document.getElementById('btnGrid');
tools.forEach(function(t){
  var b=document.createElement('button');
  b.className='tbtn';b.innerHTML=t.icon+' '+t.name;
  b.onclick=function(){togglePanel(t);};
  grid.appendChild(b);
});
function togglePanel(t){
  var ex=openPanels.find(function(p){return p.id===t.id;});
  if(ex){closePanel(ex);return;}
  var p=document.createElement('div');
  p.className='panel';p.id='panel-'+t.id;
  p.innerHTML='<div class="p-hd"><span class="t">'+t.icon+' '+t.name+'</span><button class="p-close">✕</button></div><div class="p-body" id="body-'+t.id+'"></div>';
  document.getElementById('panels').appendChild(p);
  p.querySelector('.p-close').onclick=function(){closePanel({id:t.id,el:p});};
  openPanels.push({id:t.id,el:p});
  buildTool(t.id,document.getElementById('body-'+t.id));
  while(openPanels.length>MAX_PANELS)closePanel(openPanels[0]);
  p.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function closePanel(p){if(p.el)p.el.remove();openPanels=openPanels.filter(function(x){return x.id!==p.id;});}
function buildTool(id,el){
  if(id==='qr')el.innerHTML='<div class="label">输入网址：</div><input id="qrInput" placeholder="https://..."><button class="go" onclick="qrGen()">生成二维码</button><div class="result" id="qrOut" style="text-align:center"></div>';
  else if(id==='pwd')el.innerHTML='<div class="row"><span>长度</span><input type="number" id="pwdLen" value="16" min="4" max="64"></div><div class="row"><label><input type="checkbox" id="pwdUpper" checked style="width:auto">大写</label><label><input type="checkbox" id="pwdLower" checked style="width:auto">小写</label><label><input type="checkbox" id="pwdNum" checked style="width:auto">数字</label><label><input type="checkbox" id="pwdSym" style="width:auto">符号</label></div><button class="go" onclick="pwdGen()">生成密码</button><div class="result" id="pwdOut" style="font-size:18px;color:#50fa7b;letter-spacing:2px"></div>';
  else if(id==='json')el.innerHTML='<div class="label">粘贴JSON：</div><textarea id="jsonIn" rows="4" placeholder=\'{"a":1}\'></textarea><button class="go" onclick="jsonFmt()">格式化</button><div class="result" id="jsonOut"></div>';
  else if(id==='unit')el.innerHTML='<div class="row"><input id="unitVal" type="number" placeholder="数值"><select id="unitFrom"><option value="m">米</option><option value="cm">厘米</option><option value="km">千米</option><option value="ft">英尺</option><option value="inch">英寸</option></select><span>→</span><select id="unitTo"><option value="m">米</option><option value="cm">厘米</option><option value="km">千米</option><option value="ft">英尺</option><option value="inch">英寸</option></select></div><button class="go" onclick="unitConv()">转换</button><div class="result" id="unitOut"></div>';
  else if(id==='color'){el.innerHTML='<input type="color" id="colorPick" value="#50fa7b" style="width:100%;height:60px"><div class="result" id="colorOut">HEX: #50fa7b<br>RGB: (80,250,123)</div>';document.getElementById('colorPick').oninput=function(){var h=this.value;var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);document.getElementById('colorOut').innerHTML='HEX: '+h+'<br>RGB: ('+r+','+g+','+b+')';};}
  else if(id==='regex')el.innerHTML='<div class="label">正则：</div><input id="regexPat" placeholder="\\d+"><div class="label">测试文本：</div><textarea id="regexText" rows="3"></textarea><button class="go" onclick="regexTest()">测试</button><div class="result" id="regexOut"></div>';
  else if(id==='wordcount')el.innerHTML='<div class="label">输入文字：</div><textarea id="wcIn" rows="4" oninput="wcCalc()"></textarea><div class="result" id="wcOut"></div>';
  else if(id==='countdown')el.innerHTML='<div class="label">目标日期：</div><input type="date" id="cdDate"><button class="go" onclick="cdCalc()">倒计时</button><div class="result" id="cdOut"></div>';
  else if(id==='base64')el.innerHTML='<textarea id="b64In" rows="3"></textarea><div class="row"><button class="go" onclick="b64Enc()">编码</button><button class="go" onclick="b64Dec()">解码</button></div><div class="result" id="b64Out"></div>';
  else if(id==='htmlent')el.innerHTML='<textarea id="heIn" rows="3"></textarea><div class="row"><button class="go" onclick="heEnc()">编码</button><button class="go" onclick="heDec()">解码</button></div><div class="result" id="heOut"></div>';
  else if(id==='sort')el.innerHTML='<div class="label">每行一个：</div><textarea id="sortIn" rows="4"></textarea><div class="row"><button class="go" onclick="sortTxt(&#39;asc&#39;)">A→Z</button><button class="go" onclick="sortTxt(&#39;desc&#39;)">Z→A</button></div><div class="result" id="sortOut"></div>';
  else if(id==='rand')el.innerHTML='<div class="row"><input type="number" id="randMin" value="1" style="width:60px"><span>~</span><input type="number" id="randMax" value="100" style="width:60px"><button class="go" onclick="randNum()">随机数</button><button class="go" onclick="coinFlip()">硬币</button></div><div class="result" id="randOut" style="font-size:24px;text-align:center;color:#50fa7b"></div>';
  else if(id==='markdown')el.innerHTML='<textarea id="mdIn" rows="5" oninput="mdRender()" placeholder="# 标题"></textarea><div class="result" id="mdOut"></div>';
  else if(id==='timer')el.innerHTML='<div class="result" id="swOut" style="font-size:36px;text-align:center;color:#50fa7b">00:00.0</div><div class="row" style="justify-content:center"><button class="go" onclick="swStart()">开始</button><button class="go" onclick="swLap()">计次</button><button class="go" onclick="swReset()">重置</button></div><div class="result" id="swLaps"></div>';
  else if(id==='calc'){el.innerHTML='<input id="calcDisp" readonly style="text-align:right;font-size:20px"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px"><button class="go" onclick="calcPress(&#39;C&#39;)">C</button><button class="go" onclick="calcPress(&#39;/&#39;)">÷</button><button class="go" onclick="calcPress(&#39;*&#39;)">×</button><button class="go" onclick="calcPress(&#39;-&#39;)">−</button><button class="go" onclick="calcPress(&#39;7&#39;)">7</button><button class="go" onclick="calcPress(&#39;8&#39;)">8</button><button class="go" onclick="calcPress(&#39;9&#39;)">9</button><button class="go" onclick="calcPress(&#39;+&#39;)">+</button><button class="go" onclick="calcPress(&#39;4&#39;)">4</button><button class="go" onclick="calcPress(&#39;5&#39;)">5</button><button class="go" onclick="calcPress(&#39;6&#39;)">6</button><button class="go" onclick="calcPress(&#39;=&#39;)">=</button><button class="go" onclick="calcPress(&#39;1&#39;)">1</button><button class="go" onclick="calcPress(&#39;2&#39;)">2</button><button class="go" onclick="calcPress(&#39;3&#39;)">3</button><button class="go" onclick="calcPress(&#39;0&#39;)">0</button><button class="go" onclick="calcPress(&#39;.&#39;)">.</button></div>';window._calc='';}
}
function qrGen(){var v=document.getElementById('qrInput').value.trim();if(!v)return;document.getElementById('qrOut').innerHTML='<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(v)+'" style="width:200px;height:200px;border-radius:8px">';}
function pwdGen(){var len=parseInt(document.getElementById('pwdLen').value)||16;var chars='';if(document.getElementById('pwdUpper').checked)chars+='ABCDEFGHJKLMNPQRSTUVWXYZ';if(document.getElementById('pwdLower').checked)chars+='abcdefghijkmnpqrstuvwxyz';if(document.getElementById('pwdNum').checked)chars+='23456789';if(document.getElementById('pwdSym').checked)chars+='!@#$%^&*';if(!chars)chars='abcdefgh';var arr=new Uint32Array(len);crypto.getRandomValues(arr);var pwd='';for(var i=0;i<len;i++)pwd+=chars[arr[i]%chars.length];document.getElementById('pwdOut').textContent=pwd;}
function jsonFmt(){try{document.getElementById('jsonOut').textContent=JSON.stringify(JSON.parse(document.getElementById('jsonIn').value),null,2);}catch(e){document.getElementById('jsonOut').textContent='❌ '+e.message;}}
function unitConv(){var v=parseFloat(document.getElementById('unitVal').value)||0;var f=document.getElementById('unitFrom').value,t=document.getElementById('unitTo').value;var toM={m:1,cm:0.01,km:1000,ft:0.3048,inch:0.0254};var result=v*toM[f]/toM[t];document.getElementById('unitOut').textContent=v+' '+f+' = '+result.toFixed(4)+' '+t;}
function regexTest(){try{var p=new RegExp(document.getElementById('regexPat').value,'g');var t=document.getElementById('regexText').value;var m=t.match(p);document.getElementById('regexOut').textContent=m?('匹配 '+m.length+' 处: '+m.join(', ')):'无匹配';}catch(e){document.getElementById('regexOut').textContent='❌ '+e.message;}}
function wcCalc(){var t=document.getElementById('wcIn').value;document.getElementById('wcOut').innerHTML='字符: '+t.length+' | 去空格: '+t.replace(/\s/g,'').length+' | 行: '+t.split('\n').length;}
function cdCalc(){var d=new Date(document.getElementById('cdDate').value);var diff=d-new Date();if(diff<0){document.getElementById('cdOut').textContent='已过 '+Math.abs(Math.ceil(diff/86400000))+' 天';return;}document.getElementById('cdOut').textContent='还有 '+Math.ceil(diff/86400000)+' 天';}
function b64Enc(){try{document.getElementById('b64Out').textContent=btoa(unescape(encodeURIComponent(document.getElementById('b64In').value)));}catch(e){document.getElementById('b64Out').textContent='❌';}}
function b64Dec(){try{document.getElementById('b64Out').textContent=decodeURIComponent(escape(atob(document.getElementById('b64In').value)));}catch(e){document.getElementById('b64Out').textContent='❌';}}
function heEnc(){document.getElementById('heOut').textContent=document.getElementById('heIn').value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function heDec(){document.getElementById('heOut').textContent=document.getElementById('heIn').value.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&amp;/g,'&');}
function sortTxt(dir){var lines=document.getElementById('sortIn').value.split('\n').filter(function(x){return x.trim();});lines.sort();if(dir==='desc')lines.reverse();document.getElementById('sortOut').textContent=lines.join('\n');}
function randNum(){var a=parseInt(document.getElementById('randMin').value)||1,b=parseInt(document.getElementById('randMax').value)||100;document.getElementById('randOut').textContent=Math.floor(Math.random()*(b-a+1))+a;}
function coinFlip(){document.getElementById('randOut').textContent=Math.random()<0.5?'🪙 正面':'🪙 反面';}
function mdRender(){var t=document.getElementById('mdIn').value;t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;');t=t.replace(/^### (.*)$/gm,'<h4 style="color:#8be9fd">$1</h4>');t=t.replace(/^## (.*)$/gm,'<h3 style="color:#8be9fd">$1</h3>');t=t.replace(/^# (.*)$/gm,'<h2 style="color:#50fa7b">$1</h2>');t=t.replace(/\*\*(.*?)\*\*/g,'<b>$1</b>');t=t.replace(/\*(.*?)\*/g,'<i>$1</i>');t=t.replace(/^- (.*)$/gm,'• $1<br>');t=t.replace(/\n/g,'<br>');document.getElementById('mdOut').innerHTML=t;}
var swT=0,swI=null;
function swStart(){if(swI){clearInterval(swI);swI=null;return;}var t0=Date.now()-swT;swI=setInterval(function(){swT=Date.now()-t0;var m=Math.floor(swT/60000),s=Math.floor(swT/1000)%60,ms=Math.floor(swT/100)%10;document.getElementById('swOut').textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s+'.'+ms;},100);}
function swLap(){document.getElementById('swLaps').textContent+=(document.getElementById('swOut').textContent)+'\n';}
function swReset(){clearInterval(swI);swI=null;swT=0;document.getElementById('swOut').textContent='00:00.0';document.getElementById('swLaps').textContent='';}
function calcPress(k){if(k==='C'){window._calc='';}else if(k==='='){try{window._calc=String(eval(window._calc));}catch(e){window._calc='错误';}}else{window._calc+=k;}document.getElementById('calcDisp').value=window._calc;}
</script>
<script src="https://CaesarPC.github.io/website-finder/clip.js?v=20261006c"></script>
</body>
</html>
