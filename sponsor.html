<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>品牌合作 — CaesarBase</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f1a;--card:#1a1a2e;--border:#2a2a4a;--green:#50fa7b;--blue:#8be9fd;--text:#e6e6f0;--dim:#6272a4}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topbar{background:rgba(20,20,35,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
.topbar .logo{font-size:18px;font-weight:700;color:var(--green);text-decoration:none}
.topbar a{color:var(--dim);text-decoration:none;font-size:14px}
.wrap{max-width:600px;margin:0 auto;padding:40px 20px}
h1{font-size:26px;margin-bottom:8px}
.desc{color:var(--dim);font-size:14px;margin-bottom:30px}
.form{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px}
.form label{display:block;font-size:14px;margin:16px 0 6px;color:var(--blue)}
.form input,.form textarea,.form select{width:100%;background:#0f0f1a;border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-size:14px;font-family:inherit}
.form input:focus,.form textarea:focus{border-color:var(--green);outline:none}
.form textarea{min-height:80px;resize:vertical}
.submit{width:100%;background:linear-gradient(135deg,var(--green),var(--blue));color:#0f0f1a;border:none;padding:14px;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;margin-top:24px}
.done{text-align:center;padding:40px 0;display:none}
.done h2{color:var(--green);margin-bottom:10px}
</style>
</head>
<body>
<div class="topbar">
  <a class="logo" href="index.html">CaesarBase</a>
  <a href="index.html">← 返回</a>
</div>
<div class="wrap">
  <h1>品牌导流合作申请</h1>
  <p class="desc">填写以下信息提交合作申请，站长会尽快回复。</p>
  <div class="form" id="formBox">
    <label>联系邮箱（选填）</label>
    <input type="email" id="email" placeholder="you@example.com">
    <label>联系电话（选填）</label>
    <input type="tel" id="phone" placeholder="选填">
    <label>站点链接 *</label>
    <input type="url" id="siteUrl" placeholder="https://your-site.com">
    <label>合作用途 *</label>
    <textarea id="purpose" placeholder="说明你的站点是做什么的，想在我们这里获得什么合作"></textarea>
    <label>站点规模 *</label>
    <select id="size">
      <option value="">请选择</option>
      <option value="small">小型（日PV < 1000）</option>
      <option value="medium">中型（日PV 1000-10000）</option>
      <option value="large">大型（日PV > 10000）</option>
    </select>
    <button class="submit" onclick="submitForm()">提交申请</button>
  </div>
  <div class="done" id="doneBox">
    <h2>✅ 提交成功</h2>
    <p style="color:var(--dim)">站长会尽快查看你的合作申请。</p>
    <a href="index.html" style="color:var(--green);display:inline-block;margin-top:16px">返回主站 →</a>
  </div>
</div>
<script src="cr/ghdb_v2.js?v=20261008b"></script>
<script>
function submitForm(){
  if(!document.getElementById('siteUrl').value||!document.getElementById('purpose').value||!document.getElementById('size').value){alert('请填写带*的必填项');return}
  if(!window.CrGH){alert('数据服务加载失败，请刷新重试');return}
  window.CrGH.route('POST','/api/sponsor',{
    email:document.getElementById('email').value,
    phone:document.getElementById('phone').value,
    siteUrl:document.getElementById('siteUrl').value,
    purpose:document.getElementById('purpose').value,
    size:document.getElementById('size').value
  },function(j){
    if(j&&j.ok){
      document.getElementById('formBox').style.display='none';
      document.getElementById('doneBox').style.display='block';
    }else{
      alert((j&&j.msg)?j.msg:'提交失败，请重试');
    }
  });
}
</script>
</body>
</html>
