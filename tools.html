<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实用工具 | Cr工具站</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#1e1e2e;color:#e6e6e6;min-height:100vh}
.hd{background:#282a36;padding:16px 20px;border-bottom:2px solid #50fa7b;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.hd a{color:#50fa7b;text-decoration:none;font-size:14px}
.hd h1{font-size:20px;color:#50fa7b}
.grid{display:flex;flex-wrap:wrap;gap:8px;padding:16px;max-width:900px;margin:0 auto}
.tbtn{background:#282a36;border:1px solid #44475a;border-radius:10px;padding:10px 16px;cursor:pointer;font-size:13px;color:#e6e6e6;transition:all .2s cubic-bezier(.4,0,.2,1)}
.tbtn:hover{border-color:#50fa7b;color:#50fa7b;transform:translateY(-2px)}
.tbtn:active{transform:scale(.95)}
.panels{max-width:900px;margin:0 auto;padding:0 16px 100px}
.panel{background:#282a36;border:1px solid #44475a;border-radius:12px;margin-bottom:12px;overflow:hidden;animation:slideIn .25s cubic-bezier(.4,0,.2,1)}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.p-hd{background:#1e1e2e;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.p-hd .t{font-size:14px;color:#50fa7b;font-weight:bold}
.p-close{background:#44475a;border:none;color:#e6e6e6;width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:14px;line-height:1}
.p-close:hover{background:#ff5555;color:#fff}
.p-body{padding:16px}
input,textarea,select{width:100%;box-sizing:border-box;padding:8px 10px;border-radius:6px;border:1px solid #44475a;background:#1e1e2e;color:#e6e6e6;font-size:14px;margin:4px 0}
button.go{background:#50fa7b;color:#1e1e2e;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;font-weight:bold;margin:4px 0}
.result{background:#1e1e2e;border-radius:6px;padding:10px;margin-top:8px;font-size:13px;color:#bdc3c7;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow-y:auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row input{flex:1;min-width:80px}
.label{font-size:12px;color:#6272a4;margin-top:6px}
</style>
</head>
<body>
<div class="hd"><a href="index.html">← 首页</a><h1>🛠️ 实用工具</h1></div>
<div class="grid" id="btnGrid"></div>
<div class="panels" id="panels"></div>

<script>
var tools = [
  {id:'qr', icon:'📱', name:'二维码生成器', build:qrTool},
  {id:'pwd', icon:'🔑', name:'密码生成器', build:pwdTool},
  {id:'json', icon:'{ }', name:'JSON格式化', build:jsonTool},
  {id:'unit', icon:'📏', name:'单位换算', build:unitTool},
  {id:'color', icon:'🎨', name:'颜色选择器', build:colorTool},
  {id:'regex', icon:'🔍', name:'正则测试', build:regexTool},
  {id:'wordcount', icon:'📝', name:'文字统计', build:wordcountTool},
  {id:'countdown', icon:'⏰', name:'倒计时', build:countdownTool},
  {id:'base64', icon:'🔄', name:'Base64编解码', build:base64Tool},
  {id:'htmlent', icon:'&lt;&gt;', name:'HTML实体转换', build:htmlentTool},
  {id:'sort', icon:'↕️', name:'文字排序', build:sortTool},
  {id:'rand', icon:'🎲', name:'随机数/硬币', build:randTool},
  {id:'markdown', icon:'📄', name:'Markdown预览', build:mdTool},
  {id:'timer', icon:'⏱️', name:'秒表', build:stopwatchTool},
  {id:'calc', icon:'🔢', name:'简易计算器', build:calcTool},
];
var openPanels = [];
var MAX_PANELS = 3;

var grid = document.getElementById('btnGrid');
tools.forEach(function(t){
  var b = document.createElement('button');
  b.className = 'tbtn';
  b.innerHTML = t.icon + ' ' + t.name;
  b.onclick = function(){ togglePanel(t); };
  grid.appendChild(b);
});

function togglePanel(t){
  var existing = openPanels.find(function(p){return p.id===t.id;});
  if(existing){ closePanel(existing); return; }
  var panel = document.createElement('div');
  panel.className = 'panel';
  panel.id = 'panel-' + t.id;
  panel.innerHTML = '<div class="p-hd"><span class="t">' + t.icon + ' ' + t.name + '</span><button class="p-close">✕</button></div><div class="p-body" id="body-'+t.id+'"></div>';
  document.getElementById('panels').appendChild(panel);
  panel.querySelector('.p-close').onclick = function(){ closePanel({id:t.id, el:panel}); };
  panel.querySelector('.p-hd').onclick = function(e){ if(e.target.classList.contains('p-close'))return; panel.querySelector('.p-body').style.display = panel.querySelector('.p-body').style.display==='none'?'block':'none'; };
  openPanels.push({id:t.id, el:panel});
  t.build(document.getElementById('body-'+t.id));
  while(openPanels.length > MAX_PANELS){ closePanel(openPanels[0]); }
  panel.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function closePanel(p){
  if(p.el) p.el.remove();
  openPanels = openPanels.filter(function(x){return x.id!==p.id;});
}

/* ===== 工具实现 ===== */
function qrTool(el){
  el.innerHTML = '<div class="label">输入网址或文字：</div><input id="qrInput" placeholder="https://..."><button class="go" onclick="qrGen()">生成二维码</button><div class="result" id="qrOut" style="text-align:center"></div>';
}
function qrGen(){
  var v = document.getElementById('qrInput').value.trim();
  if(!v) return;
  document.getElementById('qrOut').innerHTML = '<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(v)+'" style="width:200px;height:200px;border-radius:8px">';
}

function pwdTool(el){
  el.innerHTML = '<div class="row"><span>长度</span><input type="number" id="pwdLen" value="16" min="4" max="64"></div><div class="row"><label><input type="checkbox" id="pwdUpper" checked style="width:auto"> 大写</label><label><input type="checkbox" id="pwdLower" checked style="width:auto"> 小写</label><label><input type="checkbox" id="pwdNum" checked style="width:auto"> 数字</label><label><input type="checkbox" id="pwdSym" style="width:auto"> 符号</label></div><button class="go" onclick="pwdGen()">生成密码</button><div class="result" id="pwdOut" style="font-size:18px;color:#50fa7b;letter-spacing:2px"></div>';
}
function pwdGen(){
  var len = parseInt(document.getElementById('pwdLen').value)||16;
  var chars='';
  if(document.getElementById('pwdUpper').checked) chars+='ABCDEFGHJKLMNPQRSTUVWXYZ';
  if(document.getElementById('pwdLower').checked) chars+='abcdefghijkmnpqrstuvwxyz';
  if(document.getElementById('pwdNum').checked) chars+='23456789';
  if(document.getElementById('pwdSym').checked) chars+='!@#$%^&*';
  if(!chars) chars='abcdefgh';
  var arr=new Uint32Array(len); crypto.getRandomValues(arr);
  var pwd=''; for(var i=0;i<len;i++) pwd+=chars[arr[i]%chars.length];
  document.getElementById('pwdOut').textContent = pwd;
}

function jsonTool(el){
  el.innerHTML = '<div class="label">粘贴乱糟糟的JSON：</div><textarea id="jsonIn" rows="4" placeholder=\'{"a":1,"b":[2,3]}\'></textarea><button class="go" onclick="jsonFmt()">格式化</button><div class="result" id="jsonOut"></div>';
}
function jsonFmt(){
  try{ document.getElementById('jsonOut').textContent = JSON.stringify(JSON.parse(document.getElementById('jsonIn').value),null,2); }
  catch(e){ document.getElementById('jsonOut').textContent = '❌ JSON格式错误: '+e.message; }
}

function unitTool(el){
  el.innerHTML = '<div class="row"><input id="unitVal" type="number" placeholder="数值"><select id="unitFrom"><option value="m">米</option><option value="cm">厘米</option><option value="km">千米</option><option value="ft">英尺</option><option value="inch">英寸</option></select><span>→</span><select id="unitTo"><option value="m">米</option><option value="cm">厘米</option><option value="km">千米</option><option value="ft">英尺</option><option value="inch">英寸</option></select></div><button class="go" onclick="unitConv()">转换</button><div class="result" id="unitOut"></div>';
}
function unitConv(){
  var v=parseFloat(document.getElementById('unitVal').value)||0;
  var f=document.getElementById('unitFrom').value, t=document.getElementById('unitTo').value;
  var toM={m:1,cm:0.01,km:1000,ft:0.3048,inch:0.0254};
  var meters=v*toM[f]; var result=meters/toM[t];
  document.getElementById('unitOut').textContent = v+' '+f+' = '+result.toFixed(4)+' '+t;
}

function colorTool(el){
  el.innerHTML = '<input type="color" id="colorPick" value="#50fa7b" style="width:100%;height:60px"><div class="result" id="colorOut">HEX: #50fa7b<br>RGB: (80,250,123)</div>';
  document.getElementById('colorPick').oninput = function(){
    var h=this.value; var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
    document.getElementById('colorOut').innerHTML='HEX: '+h+'<br>RGB: ('+r+','+g+','+b+')';
  };
}

function regexTool(el){
  el.innerHTML = '<div class="label">正则表达式：</div><input id="regexPat" placeholder="\\d+"><div class="label">测试文本：</div><textarea id="regexText" rows="3" placeholder="输入要测试的文本..."></textarea><button class="go" onclick="regexTest()">测试</button><div class="result" id="regexOut"></div>';
}
function regexTest(){
  try{
    var p=new RegExp(document.getElementById('regexPat').value,'g');
    var t=document.getElementById('regexText').value;
    var m=t.match(p);
    document.getElementById('regexOut').textContent = m?('匹配到 '+m.length+' 处: '+m.join(', ')):'没有匹配';
  }catch(e){ document.getElementById('regexOut').textContent='❌ '+e.message; }
}

function wordcountTool(el){
  el.innerHTML = '<div class="label">输入文字：</div><textarea id="wcIn" rows="4" oninput="wcCalc()" placeholder="输入要统计的文字..."></textarea><div class="result" id="wcOut"></div>';
}
function wcCalc(){
  var t=document.getElementById('wcIn').value;
  document.getElementById('wcOut').innerHTML='字符: '+t.length+' | 字数(去空格): '+t.replace(/\s/g,'').length+' | 行数: '+(t?t.split('\n').length:0);
}

function countdownTool(el){
  el.innerHTML = '<div class="label">目标日期：</div><input type="date" id="cdDate"><button class="go" onclick="cdCalc()">开始倒计时</button><div class="result" id="cdOut"></div>';
}
function cdCalc(){
  var d=new Date(document.getElementById('cdDate').value);
  var now=new Date(); var diff=d-now;
  if(diff<0){document.getElementById('cdOut').textContent='已过了 '+Math.abs(Math.ceil(diff/86400000))+' 天';return;}
  var days=Math.ceil(diff/86400000);
  document.getElementById('cdOut').textContent='还有 '+days+' 天！';
}

function base64Tool(el){
  el.innerHTML = '<textarea id="b64In" rows="3" placeholder="输入文字..."></textarea><div class="row"><button class="go" onclick="b64Enc()">编码</button><button class="go" onclick="b64Dec()">解码</button></div><div class="result" id="b64Out"></div>';
}
function b64Enc(){try{document.getElementById('b64Out').textContent=btoa(unescape(encodeURIComponent(document.getElementById('b64In').value)));}catch(e){document.getElementById('b64Out').textContent='❌ '+e.message;}}
function b64Dec(){try{document.getElementById('b64Out').textContent=decodeURIComponent(escape(atob(document.getElementById('b64In').value)));}catch(e){document.getElementById('b64Out').textContent='❌ '+e.message;}}

function htmlentTool(el){
  el.innerHTML = '<textarea id="heIn" rows="3" placeholder="输入文字..."></textarea><div class="row"><button class="go" onclick="heEnc()">编码</button><button class="go" onclick="heDec()">解码</button></div><div class="result" id="heOut"></div>';
}
function heEnc(){document.getElementById('heOut').textContent=document.getElementById('heIn').value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function heDec(){document.getElementById('heOut').textContent=document.getElementById('heIn').value.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&amp;/g,'&');}

function sortTool(el){
  el.innerHTML = '<div class="label">每行一个：</div><textarea id="sortIn" rows="4" placeholder="苹果&#10;香蕉&#10;橙子"></textarea><div class="row"><button class="go" onclick="sortTxt('asc')">A→Z</button><button class="go" onclick="sortTxt('desc')">Z→A</button></div><div class="result" id="sortOut"></div>';
}
function sortTxt(dir){
  var lines=document.getElementById('sortIn').value.split('\n').filter(function(x){return x.trim();});
  lines.sort(); if(dir==='desc') lines.reverse();
  document.getElementById('sortOut').textContent=lines.join('\n');
}

function randTool(el){
  el.innerHTML = '<div class="row"><input type="number" id="randMin" value="1" style="width:60px"><span>~</span><input type="number" id="randMax" value="100" style="width:60px"><button class="go" onclick="randNum()">随机数</button><button class="go" onclick="coinFlip()">掷硬币</button></div><div class="result" id="randOut" style="font-size:24px;text-align:center;color:#50fa7b"></div>';
}
function randNum(){var a=parseInt(document.getElementById('randMin').value)||1,b=parseInt(document.getElementById('randMax').value)||100;document.getElementById('randOut').textContent=Math.floor(Math.random()*(b-a+1))+a;}
function coinFlip(){document.getElementById('randOut').textContent=Math.random()<0.5?'🪙 正面':'🪙 反面';}

function mdTool(el){
  el.innerHTML = '<div class="label">左边写Markdown，右边实时预览：</div><div class="row"><textarea id="mdIn" rows="5" oninput="mdRender()" style="flex:1" placeholder="# 标题&#10;**粗体** *斜体*&#10;- 列表项"></textarea></div><div class="result" id="mdOut"></div>';
}
function mdRender(){
  var t=document.getElementById('mdIn').value;
  t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t=t.replace(/^### (.*)$/gm,'<h4 style="color:#8be9fd">$1</h4>');
  t=t.replace(/^## (.*)$/gm,'<h3 style="color:#8be9fd">$1</h3>');
  t=t.replace(/^# (.*)$/gm,'<h2 style="color:#50fa7b">$1</h2>');
  t=t.replace(/\*\*(.*?)\*\*/g,'<b>$1</b>');
  t=t.replace(/\*(.*?)\*/g,'<i>$1</i>');
  t=t.replace(/^- (.*)$/gm,'• $1<br>');
  t=t.replace(/\n/g,'<br>');
  document.getElementById('mdOut').innerHTML=t;
}

function stopwatchTool(el){
  el.innerHTML = '<div class="result" id="swOut" style="font-size:36px;text-align:center;color:#50fa7b;font-variant-numeric:tabular-nums">00:00.0</div><div class="row" style="justify-content:center"><button class="go" onclick="swStart()">开始</button><button class="go" onclick="swLap()">计次</button><button class="go" onclick="swReset()">重置</button></div><div class="result" id="swLaps"></div>';
}
var swT=0,swI=null;
function swStart(){if(swI){clearInterval(swI);swI=null;return;}var t0=Date.now()-swT;swI=setInterval(function(){swT=Date.now()-t0;var m=Math.floor(swT/60000),s=Math.floor(swT/1000)%60,ms=Math.floor(swT/100)%10;document.getElementById('swOut').textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s+'.'+ms;},100);}
function swLap(){document.getElementById('swLaps').textContent+=(document.getElementById('swOut').textContent)+'\n';}
function swReset(){clearInterval(swI);swI=null;swT=0;document.getElementById('swOut').textContent='00:00.0';document.getElementById('swLaps').textContent='';}

function calcTool(el){
  el.innerHTML = '<input id="calcDisp" readonly style="text-align:right;font-size:20px"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0"><button class="go" onclick="calcPress(\'C\')">C</button><button class="go" onclick="calcPress(\'/\')">÷</button><button class="go" onclick="calcPress(\'*\')">×</button><button class="go" onclick="calcPress(\'-\')">−</button><button class="go" onclick="calcPress(\'7\')">7</button><button class="go" onclick="calcPress(\'8\')">8</button><button class="go" onclick="calcPress(\'9\')">9</button><button class="go" onclick="calcPress(\'+\')">+</button><button class="go" onclick="calcPress(\'4\')">4</button><button class="go" onclick="calcPress(\'5\')">5</button><button class="go" onclick="calcPress(\'6\')">6</button><button class="go" onclick="calcPress(\'=\')">=</button><button class="go" onclick="calcPress(\'1\')">1</button><button class="go" onclick="calcPress(\'2\')">2</button><button class="go" onclick="calcPress(\'3\')">3</button><button class="go" onclick="calcPress(\'0\')">0</button><button class="go" onclick="calcPress(\'.\')">.</button></div>';
  window._calc='';
}
function calcPress(k){
  if(k==='C'){window._calc='';}
  else if(k==='='){try{window._calc=String(eval(window._calc));}catch(e){window._calc='错误';}}
  else{window._calc+=k;}
  document.getElementById('calcDisp').value=window._calc;
}
</script>
<script src="https://CaesarPC.github.io/website-finder/clip.js?v=20261006c"></script>
</body>
</html>
